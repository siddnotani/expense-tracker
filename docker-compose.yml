services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 12

  auth:
    build: { context: ., dockerfile: services/auth/Dockerfile }
    ports: ["8081:8081"]
    environment: &service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expense_tracker
      SPRING_DATASOURCE_USERNAME: expense
      SPRING_DATASOURCE_PASSWORD: expense
      INTERNAL_JWT_SECRET: local-development-secret-change-me-32chars
    depends_on: { postgres: { condition: service_healthy } }

  accounts:
    build: { context: ., dockerfile: services/accounts/Dockerfile }
    ports: ["8082:8082"]
    environment: *service-env
    depends_on: { postgres: { condition: service_healthy } }

  transaction:
    build: { context: ., dockerfile: services/transaction/Dockerfile }
    ports: ["8083:8083"]
    environment: *service-env
    depends_on: { postgres: { condition: service_healthy } }

  budget:
    build: { context: ., dockerfile: services/budget/Dockerfile }
    ports: ["8084:8084"]
    environment: *service-env
    depends_on: { postgres: { condition: service_healthy } }

  bff:
    build: { context: ., dockerfile: services/bff/Dockerfile }
    ports: ["8080:8080"]
    environment:
      AUTH_SERVICE_URL: http://auth:8081
      ACCOUNTS_SERVICE_URL: http://accounts:8082
      TRANSACTION_SERVICE_URL: http://transaction:8083
      BUDGET_SERVICE_URL: http://budget:8084
    depends_on:
      auth: { condition: service_healthy }
      accounts: { condition: service_healthy }
      transaction: { condition: service_healthy }
      budget: { condition: service_healthy }

  web:
    build: ./web
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on: [bff]
